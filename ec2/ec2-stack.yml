AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 host para foro (fs3-frontend + usercontrol + threads) y bucket S3 privado para Oracle Wallet.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC que contiene la subred publica seleccionada.
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subred publica con ruta a un Internet Gateway.
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
    Description: Tamano de instancia EC2 (t3.medium recomendado para 3 contenedores).
  InstanceImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 x86_64 AMI.
  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
    Description: CIDR IPv4 permitido para acceder al puerto 80.
  CreateInstanceRole:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'
    Description: false en AWS Academy; true fuera de Academy para crear el rol IAM.
  ExistingInstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Perfil existente cuando CreateInstanceRole es false (AWS Academy).
  OracleCredentialsSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    Description: ARN del secreto JSON con DB_URL, DB_USERNAME y DB_PASSWORD.
  OracleWalletBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: Dejar vacio para que CloudFormation cree un bucket S3 privado nuevo.
  OracleWalletObjectKey:
    Type: String
    Default: Wallet.zip
    AllowedPattern: '^[A-Za-z0-9._/-]{1,1024}$'
    Description: Nombre del archivo ZIP del wallet en S3 (Wallet.zip).

Conditions:
  CreateEc2Role: !Equals [!Ref CreateInstanceRole, 'true']
  CreateWalletBucket: !Equals [!Ref OracleWalletBucketName, '']

Resources:
  OracleWalletBucket:
    Type: AWS::S3::Bucket
    Condition: CreateWalletBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  OracleWalletBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateWalletBucket
    Properties:
      Bucket: !Ref OracleWalletBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt OracleWalletBucket.Arn
              - !Sub '${OracleWalletBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ForoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP publico en puerto 80; administracion por SSM.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Public HTTP
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ForoRole:
    Type: AWS::IAM::Role
    Condition: CreateEc2Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ForoRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PullForoImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/fs3-frontend
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/usercontrol
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/threads
              - Sid: ReadOracleCredentials
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref OracleCredentialsSecretArn
              - Sid: ReadOracleWallet
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub
                  - arn:${AWS::Partition}:s3:::${WalletBucket}/${OracleWalletObjectKey}
                  - WalletBucket: !If [CreateWalletBucket, !Ref OracleWalletBucket, !Ref OracleWalletBucketName]

  ForoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateEc2Role
    Properties:
      Roles:
        - !Ref ForoRole

  ForoInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref InstanceImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !If
        - CreateEc2Role
        - !Ref ForoInstanceProfile
        - !Ref ExistingInstanceProfileName
      NetworkInterfaces:
        - SubnetId: !Ref PublicSubnetId
          DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          GroupSet:
            - !Ref ForoSecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker nginx
          systemctl enable --now docker
          systemctl enable --now amazon-ssm-agent
          rm -f /etc/nginx/conf.d/default.conf
          cat > /etc/nginx/conf.d/foro-app.conf <<'NGINX'
          server {
              listen 80 default_server;
              server_name _;

              # Microservicio usercontrol (puerto 8080)
              location /api/usuarios {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              # Microservicio threads (puerto 8081)
              location ~ ^/api/(categorias|temas|comentarios) {
                  proxy_pass http://127.0.0.1:8081;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              # Frontend Angular (contenedor en puerto 4200)
              location / {
                  proxy_pass http://127.0.0.1:4200;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX
          nginx -t
          systemctl enable --now nginx
          systemctl reload nginx
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}
        - Key: Application
          Value: foro-app
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  InstanceId:
    Description: Copiar este valor en la variable EC2_INSTANCE_ID de GitHub Actions.
    Value: !Ref ForoInstance
  PublicIp:
    Description: IP publica HTTP de la instancia EC2.
    Value: !GetAtt ForoInstance.PublicIp
  WebsiteUrl:
    Description: URL publica de la aplicacion.
    Value: !Sub http://${ForoInstance.PublicIp}/
  WalletBucketName:
    Description: Nombre del bucket S3 donde debes subir Wallet.zip.
    Value: !If [CreateWalletBucket, !Ref OracleWalletBucket, !Ref OracleWalletBucketName]
  WalletObjectKey:
    Description: Nombre del archivo en S3 (Wallet.zip).
    Value: !Ref OracleWalletObjectKey
  InstanceProfileName:
    Description: Perfil IAM asignado a la instancia EC2.
    Value: !If
      - CreateEc2Role
      - !Ref ForoInstanceProfile
      - !Ref ExistingInstanceProfileName